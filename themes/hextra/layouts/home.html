{{ define "main" }}
  {{- $latestDailyURL := partial "custom/latest-daily-url.html" (dict "currentPage" .) -}}
  <div class="bio-latest-redirect hx:mx-auto hx:flex hx:min-h-[calc(100vh-var(--navbar-height))] hx:max-w-3xl hx:items-center hx:justify-center hx:px-6 hx:py-16">
    <main aria-labelledby="latest-daily-title">
      <p class="bio-latest-redirect__eyebrow">AI Longevity Daily</p>
      <h1 id="latest-daily-title">正在进入最新一期日报</h1>
      {{- if ne $latestDailyURL "/" }}
        <p>若浏览器没有自动跳转，请<a href="{{ $latestDailyURL }}">打开最新已发布日报</a>。</p>
      {{- else }}
        <p>暂未找到已发布的日期页，请稍后刷新。</p>
      {{- end }}
    </main>
  </div>
{{ end }}
