# Hugo configuration file
title: AI生命延续学日报
baseURL: "https://news.aibioo.cn/"

timezone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
enableInlineShortcodes: true

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

theme: hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: search
      name: 搜索
      weight: 10
      params:
        type: search
    - identifier: documentation
      name: 生命延续日报
      pageRef: /
      weight: 1
    - identifier: personal-home
      name: 个人主页
      weight: 2
      url: "https://yuyu.aivora.cn"
    - identifier: ai-daily
      name: AI 日报
      weight: 2.5
      url: "https://news.aivora.cn"
    - identifier: about
      name: 关于
      pageRef: /about
      weight: 3

params:
  la51Id: "3OeesViIrmuFMAz4"
  description: 每日聚焦 AI + 长寿 / 延寿 / 衰老 / 生物年龄 / 年轻化等生命延续学前沿，追踪衰老机制、延寿干预与相关药物、工具、平台、模型。
  descriptionEn: Daily AI + longevity news and insights, tracking aging biology, rejuvenation, biological age, lifespan interventions, and related tools and models.
  navbar:
    displayLogo: false
    displayTitle: true

  author:
    name: "AI Longevity Daily"
    bio: "AI + 长寿 / 衰老 每日资讯"
    email: "justlikemaki@qq.com"

  displayUpdatedDate: true
  dateFormat: "2006/01/02 15:04:05"

  footer:
    displayCopyright: false
    displayPoweredBy: false

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 10
    article:
      displayPagination: true

  toc:
    displayTags: false

  page:
    width: wide

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content

  comments:
    enable: false

defaultContentLanguage: zh
languages:
  zh:
    languageCode: zh-CN
    contentDir: content/cn
    languageName: 简体中文
    weight: 1
  en:
    contentDir: content/en
    languageName: English
    title: AI Longevity Daily | AI + Longevity News
    weight: 2

